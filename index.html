<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Huskelisten</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}main{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3ed;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #0001}button,input{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;font-weight:700}.yes{background:#16a34a;color:white}.no{background:#e11d48;color:white}.blue{background:#2563eb;color:white}.muted{color:#667085}.row{display:flex;gap:10px}.row>*{flex:1}nav{display:flex;gap:8px}nav button{flex:1;background:#e8eefb;color:#1d4ed8}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item span{flex:1}.remove{background:#fee2e2;color:#b91c1c;padding:8px 10px}.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:12px}h1,h2{margin:.25em 0}small{color:#667085}</style>
<main><h1>Huskelisten</h1><p class="muted">Basisvarer, så I ikke glemmer det faste.</p><nav><button onclick="show('check')">Gennemgang</button><button onclick="show('list')">Indkøb</button><button onclick="show('basis')">Basisvarer</button></nav><section id="app"></section></main>
<script>
const defaults=['Mælk','Rugbrød','Toiletpapir','Vådservietter','Bleer','Vasketabs','Opvasketabs','Køkkenrulle','Affaldsposer','Håndsæbe','Tandpasta'];
let items=JSON.parse(localStorage.getItem('basisItems')||'null')||defaults; let missing=[]; let i=0; let view='check';
const app=document.querySelector('#app'); const save=()=>localStorage.setItem('basisItems',JSON.stringify(items)); const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(v){view=v;render()}
function render(){ if(view==='check') check(); else if(view==='list') list(); else basis(); }
function check(){if(i>=items.length){app.innerHTML=`<div class=card><h2>Alt er gennemgået ✓</h2><p>${items.length} basisvarer tjekket. <b>${missing.length}</b> skal købes.</p><button class=blue onclick="show('list')">Se indkøbslisten</button> <button onclick="restart()">Ny liste</button></div>`;return}let p=Math.round(i/items.length*100);app.innerHTML=`<div class=card><small>Vare ${i+1} af ${items.length}</small><div class=progress><i style="width:${p}%"></i></div><h2 style="font-size:2rem;margin-top:28px">${esc(items[i])}</h2><p>Har I nok derhjemme?</p><div class=row><button class=yes onclick="answer(false)">✓ Har nok</button><button class=no onclick="answer(true)">+ Mangler</button></div></div>`}
function answer(m){if(m&&!missing.includes(items[i]))missing.push(items[i]);i++;render()}
function restart(){missing=[];i=0;view='check';render()}
function list(){app.innerHTML=`<div class=card><h2>Indkøbsliste</h2>${missing.length?'':`<p class=muted>Ingen varer tilføjet endnu.</p>`}<div>${missing.map(x=>`<label class=item><input type=checkbox style="width:auto"><span>${esc(x)}</span></label>`).join('')}</div><button style="margin-top:16px" onclick="restart()">Start ny gennemgang</button></div>`}
function basis(){app.innerHTML=`<div class=card><h2>Basisvarer</h2><p class=muted>Disse gennemgås hver gang. Listen gemmes på telefonen.</p><div class=row><input id=n maxlength=40 placeholder="Ny basisvare"><button class=blue onclick="add()">Tilføj</button></div><div>${items.map((x,k)=>`<div class=item><span>${esc(x)}</span><button class=remove onclick="del(${k})">Fjern</button></div>`).join('')}</div></div>`}
function add(){let n=document.querySelector('#n').value.trim();if(n&&!items.some(x=>x.toLowerCase()===n.toLowerCase())){items.push(n);save();basis()}}
function del(k){items.splice(k,1);save();i=Math.min(i,items.length);basis()}
render();
</script></html>
