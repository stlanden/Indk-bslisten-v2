<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Huskelisten</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}main{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3ed;border-radius:22px;padding:20px;margin:14px 0}button,input{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;font-weight:700}.yes{background:#16a34a;color:#fff}.no{background:#e11d48;color:#fff}.blue{background:#2563eb;color:white}.muted{color:#667085}.row{display:flex;gap:10px}.row>*{flex:1}nav{display:flex;gap:8px}nav button{flex:1;background:#e8eefb;color:#1d4ed8}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item span{flex:1}.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb}</style><main><h1>Huskelisten</h1><p class="muted">Gennemgå alle faste basisvarer.</p><nav><button onclick="show('check')">Gennemgang</button><button onclick="show('list')">Indkøb</button><button onclick="show('basis')">Basisvarer</button></nav><section id="app"></section></main><script>
const groups=[["Badeværelset", ["Toiletpapir", "Bleer", "Tandpasta", "Håndsæbe", "Shampoo", "Balsam", "Børneshampoo", "Børnetandpasta"]], ["Køkkenet", ["Mælk", "Smør", "Rugbrød", "Havregryn", "Te", "Kaffe", "Køkkenrulle", "Sølvpapir", "Madpapir", "Bagepapir", "Fryseposer", "Plastfolie/husholdningsfilm", "Kaffefiltre", "Lynlåsposer/Zip-lock poser", "Sukker", "Salt", "Peber", "Olie", "Mel", "Ost", "Toastbrød", "Morgenmadsprodukt/Cornflakes", "Ketchup", "Remoulade", "Mayonnaise", "Bouillon", "Pasta", "Ris", "Sojasauce", "Majs", "Frosne ærter", "Pommes frites", "Kyllingepølser", "Leverpostej", "Spegepølse", "Hummus", "Æbler", "Pærer", "Bananer", "Nudler", "Kidneybønner", "Kikærter", "Maizena", "Brødblanding", "Gær", "Flødeost", "Agurk", "Kartofler", "Løg", "Hvidløg", "Hakkede tomater", "Tomatpuré", "Saftevand", "Vådservietter", "Opvasketabs", "Affaldsposer", "Maskinopvaskesalt", "Afspændingsmiddel", "Svampe/skuresvampe", "Karklude", "Støvsugerposer", "Små skraldeposer", "Plastre", "Salt til opvaskemaskine", "Opvaskemiddel"]], ["Bryggers", ["Vaskemiddel", "Universalrengøring", "Glasrens", "Kalkfjerner", "Gulvrens", "Toiletrens"]]];
const sequence=[];groups.forEach(([room,its])=>{sequence.push({type:"room",name:room});its.forEach(name=>sequence.push({type:"item",name,room}))});
const items=sequence.filter(x=>x.type==="item").map(x=>x.name);
let buy=[],i=0,view='check';const app=document.querySelector('#app'),esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(v){view=v;render()}function render(){view==='check'?check():view==='list'?list():basis()}function check(){if(i>=sequence.length){app.innerHTML=`<div class=card><h2>Alt er gennemgået ✓</h2><p><b>${items.length}</b> basisvarer tjekket. <b>${buy.length}</b> skal købes.</p><button class=blue onclick="show('list')">Se indkøbslisten</button> <button onclick="restart()">Ny gennemgang</button></div>`;return}const cur=sequence[i];if(cur.type==="room"){app.innerHTML=`<div class=card style="text-align:center;padding:44px 20px"><div style="font-size:12px;font-weight:800;letter-spacing:.12em;color:#2563eb">NÆSTE OMRÅDE</div><h2 style="font-size:2.4rem;margin:12px 0">${esc(cur.name)}</h2><p class=muted>Gå til ${esc(cur.name.toLowerCase())} og tjek varerne her.</p><button class=blue onclick="nextRoom()">Start området</button></div>`;return}let checked=sequence.slice(0,i).filter(x=>x.type==="item").length,p=Math.round(checked/items.length*100);app.innerHTML=`<div class=card><div style="font-weight:800;color:#2563eb;margin-bottom:6px">${esc(cur.room)}</div><small>Basisvare ${checked+1} af ${items.length}</small><div class=progress><i style="width:${p}%"></i></div><h2 style="font-size:2rem;margin-top:28px">${esc(cur.name)}</h2><p>Har I nok derhjemme?</p><div class=row><button class=yes onclick="answer(false)">✓ Har nok</button><button class=no onclick="answer(true)">+ Mangler</button></div></div>`}function nextRoom(){i++;render()}function answer(m){const n=sequence[i].name;if(m&&!buy.includes(n))buy.push(n);i++;render()}function restart(){buy=[];i=0;view='check';render()}function list(){app.innerHTML=`<div class=card><h2>Indkøbsliste</h2>${buy.length?buy.map(x=>`<label class=item><input type=checkbox style="width:auto"><span>${esc(x)}</span></label>`).join(''):'<p class=muted>Ingen varer tilføjet endnu.</p>'}<button style="margin-top:16px" onclick="restart()">Start ny gennemgang</button></div>`}function basis(){app.innerHTML=`<div class=card><h2>Basisvarer (${items.length})</h2>${groups.map(([g,a])=>`<h3 style='margin-top:24px;color:#2563eb'>${esc(g)}</h3>${a.map(x=>`<div class=item><span>${esc(x)}</span></div>`).join('')}`).join('')}</div>`}render();</script></html>
